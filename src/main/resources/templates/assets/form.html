<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(${asset.id == null ? 'Add Asset' : 'Edit Asset'}, ~{::section})}">
<head></head>
<body>
<section>
    <div style="background:white; padding:20px; border-radius:8px;">
        <h2 th:text="${asset.id == null ? 'Register New Asset' : 'Edit Asset'}">Title</h2>
        <form th:action="${asset.id == null ? '/assets/add' : '/assets/edit/' + asset.id}" th:object="${asset}" method="post">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                <div><label>Asset Tag *</label><input type="text" th:field="*{assetTag}" required style="width:100%;"></div>
                <div><label>Serial Number *</label><input type="text" th:field="*{serialNumber}" required></div>
                <div><label>Brand *</label><input type="text" th:field="*{brand}" required></div>
                <div><label>Model *</label><input type="text" th:field="*{model}" required></div>
                <div><label>Device Type *</label><select th:field="*{deviceType}" required><option value="">-- Select --</option><option th:each="t : ${deviceTypes}" th:value="${t}" th:text="${t}"></option></select></div>
                <div><label>Condition *</label><select th:field="*{condition}" required><option value="">-- Select --</option><option th:each="c : ${conditions}" th:value="${c}" th:text="${c}"></option></select></div>
                <div><label>Status</label><select th:field="*{status}"><option th:each="s : ${assetStatuses}" th:value="${s}" th:text="${s}"></option></select></div>
                <div><label>Department</label><select th:field="*{department.id}"><option value="">-- None --</option><option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option></select></div>
                <div style="grid-column:span 2"><label>Specifications</label><textarea th:field="*{specifications}" rows="3"></textarea></div>
                <div><label>Purchase Date</label><input type="date" th:field="*{purchaseDate}"></div>
                <div><label>Warranty Expiry</label><input type="date" th:field="*{warrantyExpiry}"></div>
                <div style="grid-column:span 2"><label>Notes</label><textarea th:field="*{notes}" rows="2"></textarea></div>
            </div>
            <div style="margin-top:20px;"><button type="submit">Save Asset</button> <a href="/assets" style="margin-left:10px; background:#95a5a6; padding:6px 12px; text-decoration:none; color:white; border-radius:4px;">Cancel</a></div>
        </form>
    </div>
</section>
</body>
</html>
