<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Access Denied - Airtel Inventory</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .error-container {
            background: white;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 {
            font-size: 6rem;
            color: #e74c3c;
            margin-bottom: 10px;
        }
        h3 {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        a {
            display: inline-block;
            background: #e74c3c;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.2s;
        }
        a:hover {
            background: #c0392b;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="icon">🔒</div>
    <h1>403</h1>
    <h3>Access Denied</h3>
    <p>You do not have permission to view this page.<br>Please contact your administrator if you believe this is an error.</p>
    <a href="/dashboard">← Back to Dashboard</a>
</div>
</body>
</html>
