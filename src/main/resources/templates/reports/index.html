<!DOCTYPE html>
<html th:replace="~{layout/base :: layout('Reports - Airtel Inventory', ~{::section})}">
<head></head>
<body>
<section>
    <h2>Reports Dashboard</h2>
    <div class="row" style="margin-bottom:30px;">
        <div class="col-md-3"><div class="stat-card"><h3 th:text="${summary.totalAssets}">0</h3><p>Total Assets</p></div></div>
        <div class="col-md-3"><div class="stat-card"><h3 th:text="${summary.available}">0</h3><p>Available</p></div></div>
        <div class="col-md-3"><div class="stat-card"><h3 th:text="${summary.assigned}">0</h3><p>Assigned</p></div></div>
        <div class="col-md-3"><div class="stat-card"><h3 th:text="${summary.activeAssignments}">0</h3><p>Active Assignments</p></div></div>
    </div>
    <div style="background:white; padding:15px; border-radius:8px; margin-bottom:20px;">
        <h4>Filter Audit Log</h4>
        <form method="get" action="/reports/filter" style="display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="text" name="action" placeholder="Action (e.g., ASSET_CREATED)" style="flex:2;">
            <input type="text" name="userEmail" placeholder="User email" style="flex:2;">
            <input type="date" name="startDate" style="flex:1;">
            <input type="date" name="endDate" style="flex:1;">
            <button type="submit" style="background:#3498db;">Filter</button>
            <a href="/reports" style="background:#95a5a6; padding:6px 12px; text-decoration:none; color:white; border-radius:4px;">Reset</a>
        </form>
    </div>
    <div style="background:white; border-radius:8px; margin-bottom:20px;">
        <h4 style="padding:15px;">Assignments Per User</h4>
        <table style="width:100%;"><thead><tr><th>User</th><th>Total Assignments</th></tr></thead><tbody><tr th:each="row : ${assignmentsPerUser}"><td th:text="${row[0]}">-</td><td th:text="${row[1]}">0</td></tr></tbody></table>
    </div>
    <div style="background:white; border-radius:8px;">
        <h4 style="padding:15px;">Audit Log</h4>
        <div style="overflow-x:auto;"><table style="width:100%;"><thead><tr><th>Timestamp</th><th>Action</th><th>Details</th><th>Performed By</th></tr></thead><tbody><tr th:each="log : ${auditLogs}"><td th:text="${#temporals.format(log.timestamp, 'dd MMM yyyy HH:mm:ss')}">-</td><td th:text="${log.action}">-</td><td th:text="${log.details}">-</td><td th:text="${log.performedBy}">-</td></tr></tbody></table></div>
    </div>
</section>
</body>
</html>
